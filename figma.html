<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StudyMate-</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef0f6;
        display: flex;
        justify-content: center;
        font:
          14px Inter,
          Arial;
        color: #202945;
      }
      .phone {
        width: 390px;
        height: 844px;
        background: #fbfcff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 70px #23345a30;
        --b: #5362e8;
        --muted: #8992a7;
      }
      .status {
        height: 44px;
        padding: 13px 23px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
      }
      .login {
        height: 800px;
        padding: 24px 27px 35px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 25px 0 60px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 15px;
        background: var(--b);
        color: white;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .brand b {
        font-size: 15px;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .login h1 {
        font-size: 27px;
        margin: 0;
      }
      .intro {
        font-size: 12px;
        color: var(--muted);
        margin: 7px 0 25px;
      }
      .field {
        margin-bottom: 15px;
      }
      .field label {
        font-size: 10px;
        font-weight: 700;
        display: block;
        margin-bottom: 7px;
      }
      .input {
        width: 100%;
        height: 48px;
        border: 1px solid #e4e8f1;
        border-radius: 13px;
        padding: 0 13px;
        font: 12px Inter;
        outline: none;
      }
      .input:focus {
        border-color: var(--b);
      }
      .err {
        font-size: 10px;
        color: #dc5d6d;
        margin-top: 5px;
      }
      .forgot {
        display: block;
        margin: 8px 0 0 auto;
        border: 0;
        background: none;
        color: var(--b);
        font: 600 10px Inter;
        cursor: pointer;
      }
      .btn {
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--b);
        color: white;
        font: 700 13px Inter;
        cursor: pointer;
        box-shadow: 0 7px 16px #5362e833;
      }
      .full {
        width: 100%;
      }
      .login .btn {
        margin-top: 27px;
      }
      .hint {
        margin-top: auto;
        background: #f1f3ff;
        border-radius: 13px;
        padding: 12px;
        font-size: 10px;
        color: #77819b;
      }
      .hide {
        display: none !important;
      }
      .view {
        height: calc(100% - 121px);
        overflow: auto;
        padding: 16px 20px 22px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 17px;
      }
      .eyebrow {
        font-size: 10px;
        color: var(--muted);
        font-weight: 600;
      }
      .title {
        font-size: 22px;
        letter-spacing: -0.6px;
        margin: 3px 0;
        font-weight: 750;
      }
      .avatar {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 15px;
        background: linear-gradient(135deg, #f1d2c8, #dba397);
        color: white;
        font: bold 13px Inter;
      }
      .card {
        background: white;
        border: 1px solid #eef0f5;
        border-radius: 17px;
        padding: 14px;
        margin-bottom: 11px;
        box-shadow: 0 5px 18px #28375708;
      }
      .sect {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 18px 1px 9px;
      }
      .sect b {
        font-size: 13px;
      }
      .link {
        border: 0;
        background: none;
        color: var(--b);
        font: 600 10px Inter;
        cursor: pointer;
      }
      .hero {
        background: linear-gradient(130deg, #4f60e4, #7984f3);
        color: white;
        padding: 16px;
        border-radius: 19px;
        margin-bottom: 16px;
      }
      .hero .eyebrow {
        color: #e3e6ff;
      }
      .hero h3 {
        font-size: 16px;
        line-height: 1.35;
        margin: 8px 0;
      }
      .hero small {
        font-size: 10px;
        color: #e5e8ff;
      }
      .class {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #f0f1f6;
      }
      .class:last-child {
        border: 0;
      }
      .time {
        font-size: 9px;
        font-weight: 700;
        color: var(--b);
        width: 55px;
      }
      .stripe {
        width: 3px;
        height: 32px;
        background: #7a86f3;
        border-radius: 4px;
      }
      .stripe.g {
        background: #55bea0;
      }
      .stripe.o {
        background: #efb25b;
      }
      .info {
        flex: 1;
      }
      .info b,
      .deadline b {
        display: block;
        font-size: 11px;
      }
      .info small,
      .deadline small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .ini {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: #f0f2ff;
        color: var(--b);
        display: grid;
        place-items: center;
        font-size: 9px;
        font-weight: 700;
      }
      .progress {
        height: 7px;
        background: #edf0f8;
        border-radius: 8px;
        margin-top: 10px;
        overflow: hidden;
      }
      .progress i {
        height: 100%;
        display: block;
        background: linear-gradient(90deg, #5362e8, #8490fb);
      }
      .deadline {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid #f0f1f6;
      }
      .deadline:last-child {
        border: 0;
      }
      .date {
        width: 36px;
        height: 38px;
        border-radius: 10px;
        background: #fff1ec;
        color: #df8a6b;
        display: grid;
        place-items: center;
        font-size: 8px;
        font-weight: 700;
      }
      .nav {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 77px;
        background: white;
        border-top: 1px solid #edf0f5;
        display: flex;
        justify-content: space-around;
        padding: 8px;
      }
      .nav button {
        border: 0;
        background: none;
        color: #9ca5b6;
        font: 500 9px Inter;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        min-width: 56px;
      }
      .nav button.active {
        color: var(--b);
        font-weight: 700;
      }
      .ico {
        font-size: 19px;
        line-height: 22px;
      }
      .days {
        display: flex;
        justify-content: space-between;
        margin: 4px 0 14px;
      }
      .day {
        border: 0;
        background: none;
        color: #8590a6;
        border-radius: 10px;
        padding: 9px 8px;
        font: 600 10px Inter;
      }
      .day.active {
        background: var(--b);
        color: white;
      }
      .task {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid #f0f1f6;
      }
      .task:last-child {
        border: 0;
      }
      .task span {
        font-size: 11px;
        font-weight: 600;
        flex: 1;
      }
      .task small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        margin-top: 3px;
      }
      .task input {
        accent-color: var(--b);
      }
      .focus {
        background: #f2f3ff;
        border-radius: 17px;
        text-align: center;
        padding: 16px;
      }
      .timer {
        font-size: 38px;
        font-weight: 750;
        margin: 9px;
      }
      .mode {
        border: 0;
        background: white;
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--b);
        font: 600 10px Inter;
      }
      .suggest {
        display: flex;
        gap: 11px;
        padding: 13px;
        border: 1px solid #eef0f5;
        background: white;
        border-radius: 16px;
        margin-bottom: 10px;
      }
      .emoji {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: #f0f2ff;
        display: grid;
        place-items: center;
        font-size: 17px;
        flex: none;
      }
      .suggest b {
        font-size: 11px;
      }
      .suggest p {
        font-size: 10px;
        color: #69748d;
        line-height: 1.55;
        margin: 4px 0 0;
      }
      .chart {
        height: 120px;
        display: flex;
        justify-content: space-around;
        align-items: end;
        padding-top: 10px;
      }
      .barwrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: end;
        align-items: center;
        gap: 6px;
      }
      .bar {
        width: 19px;
        background: #dfe3ff;
        border-radius: 6px 6px 3px 3px;
      }
      .bar.hot {
        background: linear-gradient(#808bf4, #5261e5);
      }
      .barwrap small {
        font-size: 9px;
        color: #939caf;
      }
      .ring {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: conic-gradient(#5362e8 0 88%, #e9ecf5 88%);
        display: grid;
        place-items: center;
        position: relative;
        flex: none;
      }
      .ring:after {
        content: "";
        position: absolute;
        inset: 7px;
        background: white;
        border-radius: 50%;
      }
      .ring span {
        z-index: 1;
        font-weight: 800;
      }
      .setting {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #f0f1f6;
      }
      .setting:last-child {
        border: 0;
      }
      .setting b {
        font-size: 11px;
      }
      .setting small {
        display: block;
        color: var(--muted);
        font-size: 9px;
      }
      .toggle {
        width: 37px;
        height: 21px;
        border: 0;
        border-radius: 20px;
        background: #dfe3ed;
      }
      .toggle.on {
        background: var(--b);
      }
      .profile {
        text-align: center;
        padding: 12px;
      }
      .pic {
        width: 78px;
        height: 78px;
        border-radius: 25px;
        margin: auto auto 10px;
        background: linear-gradient(135deg, #f1d2c8, #dba397);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
        font-size: 24px;
      }
      .profile h2 {
        font-size: 18px;
        margin: 0;
      }
      .profile p {
        font-size: 10px;
        color: var(--muted);
      }
      .fab {
        position: absolute;
        right: 20px;
        bottom: 89px;
        height: 46px;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: var(--b);
        color: white;
        font: bold 11px Inter;
        box-shadow: 0 7px 16px #5362e849;
      }
      .toast {
        position: absolute;
        bottom: 88px;
        left: 50%;
        transform: translate(-50%, 20px);
        opacity: 0;
        background: #202b48;
        color: white;
        padding: 10px 14px;
        border-radius: 11px;
        font-size: 10px;
        transition: 0.2s;
        white-space: nowrap;
        z-index: 8;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: #101b3766;
        z-index: 7;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .modal {
        background: white;
        border-radius: 21px;
        padding: 20px;
        width: 100%;
      }
      .modal b {
        font-size: 15px;
      }
      .modal p {
        font-size: 10px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 9px;
      }
      .actions button {
        flex: 1;
        height: 43px;
        border-radius: 12px;
        font: 700 11px Inter;
      }
      .secondary {
        border: 1px solid #edf0f6;
        background: white;
      }
      .danger {
        border: 0;
        background: #df6071;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●●　◔　▰</span></div>
      <div id="login" class="login">
        <div class="brand">
          <span class="mark">✦</span
          ><b>StudyMate-<small>SMART STUDENT ASSISTANT</small></b>
        </div>
        <h1>Welcome back 👋</h1>
        <p class="intro">Your next great study session starts here.</p>
        <div class="field">
          <label>Student Gmail or Personal Gmail</label
          ><input class="input" value="example@university.edu" />
        </div>
        <div class="field">
          <label>Password</label
          ><input
            id="pass"
            class="input"
            type="password"
            placeholder="Enter your password"
          />
          <div id="err" class="err hide">
            That password doesn’t look right. Try again.
          </div>
          <button class="forgot" onclick="toast('Password reset link sent')">
            Forgot password?
          </button>
        </div>
        <button id="loginbtn" class="btn full" onclick="login()">
          Log in　→
        </button>
        <div class="hint">Demo access: any password except <b>wrong</b></div>
      </div>
      <main id="view" class="view hide"></main>
      <nav id="nav" class="nav hide">
        <button data-p="home" class="active" onclick="go('home')">
          <span class="ico">⌂</span>Home</button
        ><button data-p="routine" onclick="go('routine')">
          <span class="ico">▦</span>Routine</button
        ><button data-p="planner" onclick="go('planner')">
          <span class="ico">☷</span>Planner</button
        ><button data-p="progress" onclick="go('progress')">
          <span class="ico">◔</span>Progress</button
        ><button data-p="profile" onclick="go('profile')">
          <span class="ico">♙</span>Profile
        </button>
      </nav>
      <button id="fab" class="fab hide" onclick="addTask()">＋ Add task</button>
      <div id="toast" class="toast"></div>
      <div id="modal"></div>
    </div>
    <script>
      let day = "Mon",
        glasses = 5,
        secs = 1500,
        running = false,
        tasks = [
          ["Review linked list notes", "Data Structures · 45 min", true],
          ["Solve 10 matrix problems", "Linear Algebra · 30 min", false],
          ["Read chapter 4", "Database Systems · 40 min", false],
        ],
        iv = null;
      const cs = [
        [
          "09:00 AM",
          "10:15",
          "Data Structures",
          "Room 302 · Science Block",
          "DR",
          "",
        ],
        [
          "11:00 AM",
          "12:15",
          "Discrete Mathematics",
          "Room 214 · Main Building",
          "PA",
          "g",
        ],
        [
          "02:00 PM",
          "03:15",
          "Database Systems",
          "Lab 04 · ICT Building",
          "MC",
          "o",
        ],
      ];
      function head(
        k,
        t,
        r = '<button class="avatar" onclick="go(\'profile\')">AM</button>',
      ) {
        return (
          '<div class="top"><div><div class="eyebrow">' +
          k +
          '</div><h1 class="title">' +
          t +
          "</h1></div>" +
          r +
          "</div>"
        );
      }
      function classcard() {
        return (
          '<div class="card">' +
          cs
            .map(
              (c) =>
                '<div class="class"><div class="time">' +
                c[0] +
                '<br><span style="color:#a1a8b7">' +
                c[1] +
                '</span></div><div class="stripe ' +
                c[5] +
                '"></div><div class="info"><b>' +
                c[2] +
                "</b><small>" +
                c[3] +
                "</small><small>" +
                { DR: "Dr. Rahman", PA: "Prof. Ahmed", MC: "Ms. Chowdhury" }[
                  c[4]
                ] +
                '</small></div><div class="ini">' +
                c[4] +
                "</div></div>",
            )
            .join("") +
          "</div>"
        );
      }
      function dl() {
        return (
          '<div class="card">' +
          [
            [
              "OCT<br>16",
              "Database design project",
              "Database Systems · 4 days left",
            ],
            [
              "OCT<br>20",
              "Linear Algebra problem set",
              "Mathematics · 8 days left",
            ],
          ]
            .map(
              (x) =>
                '<div class="deadline"><div class="date">' +
                x[0] +
                "</div><div><b>" +
                x[1] +
                "</b><small>" +
                x[2] +
                "</small></div></div>",
            )
            .join("") +
          "</div>"
        );
      }
      function home() {
        return (
          head("MONDAY, OCTOBER 12", "Good morning, Alex ☀️") +
          '<div class="hero"><div class="eyebrow">YOUR STUDY BUDDY</div><h3>Small steps today,<br>big wins tomorrow.</h3><small>4-day study streak 🔥</small></div><div class="sect"><b>Today’s classes</b><button class="link" onclick="go(\'routine\')">Full routine →</button></div>' +
          classcard() +
          '<div class="sect"><b>Study goal</b><span class="eyebrow">2 of 4 hours</span></div><div class="card"><b>50% <span class="eyebrow">completed</span></b><div class="progress"><i style="width:50%"></i></div></div><div class="sect"><b>Coming up</b><button class="link" onclick="go(\'planner\')">See all →</button></div>' +
          dl() +
          '<div class="sect"><b>Water intake 💧</b><span class="eyebrow"><button class="link" onclick="water(-1)">−</button> ' +
          glasses +
          '/8 <button class="link" onclick="water(1)">＋</button></span></div><div class="card"><div style="display:flex;gap:7px">' +
          Array.from(
            { length: 8 },
            (_, i) =>
              '<span style="width:23px;height:29px;border:1.5px solid #91a4ff;border-radius:5px;background:' +
              (i < glasses
                ? "linear-gradient(to top,#a9b8ff 55%,white 55%)"
                : "white") +
              '"></span>',
          ).join("") +
          '</div></div><div class="sect"><b>AI Suggestion</b><button class="link" onclick="go(\'suggestions\')">Explore →</button></div><div class="suggest" onclick="go(\'suggestions\')"><div class="emoji">✦</div><div><b>A little prep goes a long way</b><p>Tomorrow you have Data Structures. Study Linked List for 1 hour today.</p></div></div>'
        );
      }
      function routine() {
        return (
          head(
            "YOUR WEEK AT A GLANCE",
            "Class routine",
            '<button class="avatar" onclick="toast(\'Reminders are on 🔔\')">♧</button>',
          ) +
          '<div class="days">' +
          ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"]
            .map(
              (d) =>
                '<button class="day ' +
                (d === day ? "active" : "") +
                '" onclick="select(\'' +
                d +
                "')\">" +
                d +
                "</button>",
            )
            .join("") +
          '</div><div class="sect"><b>' +
          (day === "Mon" ? "Today · Monday" : day + " · Weekly schedule") +
          '</b><span class="eyebrow">3 classes</span></div>' +
          classcard() +
          '<div class="sect"><b>Class reminders</b></div><div class="card"><div class="setting"><div><b>Upcoming class alerts</b><small>Notify me 15 minutes before class</small></div><button class="toggle on" onclick="this.classList.toggle(\'on\')"></button></div></div><div class="hero"><div class="eyebrow">NEXT CLASS</div><h3>Data Structures · 9:00 AM</h3><small>Room 302 · Science Block</small></div>'
        );
      }
      function planner() {
        return (
          head(
            "MONDAY, OCTOBER 12",
            "Your study plan",
            '<button class="avatar" onclick="go(\'focus\')">◷</button>',
          ) +
          '<div class="focus"><div class="eyebrow">POMODORO FOCUS SESSION</div><div id="timer" class="timer">' +
          fmt() +
          '</div><button class="mode" onclick="setmode(25)">25 min</button> <button class="mode" onclick="setmode(50)">50 min</button><br><button class="btn" style="height:39px;padding:0 21px;margin-top:11px" onclick="toggle()">Start / Pause</button></div><div class="sect"><b>Today’s tasks</b><span class="eyebrow">' +
          tasks.filter((t) => t[2]).length +
          "/" +
          tasks.length +
          ' complete</span></div><div class="card">' +
          tasks
            .map(
              (t, i) =>
                '<div class="task"><input type="checkbox" ' +
                (t[2] ? "checked" : "") +
                ' onchange="check(' +
                i +
                ',this.checked)"><span>' +
                t[0] +
                "<small>" +
                t[1] +
                "</small></span></div>",
            )
            .join("") +
          '</div><div class="sect"><b>Exam revision plan</b><button class="link" onclick="toast(\'Revision plan opened\')">View plan →</button></div><div class="card"><b style="font-size:11px">Data Structures · Midterm</b><p class="eyebrow">6 topics · Exam in 12 days · Week 2/3</p><div class="progress"><i style="width:64%"></i></div></div><div class="sect"><b>Assignment deadlines</b></div>' +
          dl()
        );
      }
      function focus() {
        return (
          head(
            "PLANNER · FOCUS MODE",
            "Pomodoro timer",
            '<button class="link" onclick="go(\'planner\')">← Back</button>',
          ) +
          '<div class="card" style="margin-top:30px;text-align:center;padding:24px"><div class="emoji" style="margin:auto">🎯</div><div class="eyebrow">DEEP WORK SESSION</div><div id="timer" class="timer" style="font-size:54px">' +
          fmt() +
          '</div><button class="mode" onclick="setmode(25)">Focus · 25 min</button> <button class="mode" onclick="setmode(50)">Focus · 50 min</button><button class="btn full" style="margin-top:20px" onclick="toggle()">Start / Pause</button></div><div class="sect"><b>Up next</b></div><div class="card"><b style="font-size:11px">Review linked list notes</b><p class="eyebrow">Data Structures · 45 min</p></div>'
        );
      }
      function suggestions() {
        return (
          head(
            "MADE FOR YOU",
            "AI suggestions",
            '<button class="link" onclick="go(\'home\')">← Home</button>',
          ) +
          '<div class="hero"><div class="eyebrow">YOUR STUDY COMPANION</div><h3>A balanced week starts with one good choice.</h3><small>Personalized for your goals ✨</small></div>' +
          [
            [
              "📚",
              "Get ahead for tomorrow",
              "Study Linked List for an hour before tomorrow’s Data Structures class.",
            ],
            [
              "🧠",
              "Try active recall",
              "Explain binary trees from memory to help the concepts stick.",
            ],
            [
              "💧",
              "Time for a water break",
              "You’re at " + glasses + " of 8 glasses. Stay hydrated.",
            ],
            [
              "🌿",
              "Give your eyes a rest",
              "Look away from your screen for 20 seconds.",
            ],
            [
              "☕",
              "Your focus break is due",
              "Stretch for five minutes, then come back refreshed.",
            ],
          ]
            .map(
              (x, i) =>
                '<div class="sect"><b>' +
                [
                  "Study smarter",
                  "Study smarter",
                  "Take care of you",
                  "Take care of you",
                  "Reset & recharge",
                ][i] +
                '</b><span class="eyebrow">' +
                ["STUDY", "STUDY", "HEALTH", "HEALTH", "BREAK"][i] +
                '</span></div><div class="suggest"><div class="emoji">' +
                x[0] +
                "</div><div><b>" +
                x[1] +
                "</b><p>" +
                x[2] +
                "</p></div></div>",
            )
            .join("")
        );
      }
      function progress() {
        return (
          head("YOUR CONSISTENCY ADDS UP", "My progress") +
          '<div class="card"><b style="font-size:12px">Study hours</b><p class="eyebrow">This week · 16.5 hrs　<span style="color:#5362e8">+12% ↗</span></p><div class="chart">' +
          [
            ["M", 44],
            ["T", 65],
            ["W", 51],
            ["T", 86],
            ["F", 62],
            ["S", 34],
            ["S", 53],
          ]
            .map(
              (x, i) =>
                '<div class="barwrap"><div class="bar ' +
                (i === 3 ? "hot" : "") +
                '" style="height:' +
                x[1] +
                '%"></div><small>' +
                x[0] +
                "</small></div>",
            )
            .join("") +
          '</div></div><div class="sect"><b>Class attendance</b><span class="eyebrow">This semester</span></div><div class="card" style="display:flex;align-items:center;gap:14px"><div class="ring"><span>92%</span></div><div><b style="font-size:11px">Excellent consistency! 🎉</b><p class="eyebrow">46 of 50 classes attended.<br>Keep showing up.</p></div></div><div class="sect"><b>Weekly goal completion</b><button class="link" onclick="toast(\'Goal: 20 study hours\')">Edit goal</button></div><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:11px">20 hour study goal</b><p class="eyebrow">3.5 hours to go this week</p></div><div class="ring"><span>82%</span></div></div><div class="progress"><i style="width:82%"></i></div>'
        );
      }
      function profile() {
        return (
          head("ACCOUNT", "Profile & settings") +
          '<div class="card profile"><div class="pic">AM</div><h2>Md. Moshiour Rahman Sajol</h2><p>Computer Science & Engineering· Batch 17th</p><span class="eyebrow">Student ID 0622410105101028</span></div><div class="sect"><b>Preferences</b></div><div class="card">' +
          [
            ["Class reminders", "Before each class", true],
            ["Study nudges", "Friendly focus check-ins", true],
            ["Assignment alerts", "Upcoming due dates", false],
          ]
            .map(
              (x) =>
                '<div class="setting"><div><b>' +
                x[0] +
                "</b><small>" +
                x[1] +
                '</small></div><button class="toggle ' +
                (x[2] ? "on" : "") +
                '" onclick="this.classList.toggle(\'on\')"></button></div>',
            )
            .join("") +
          '</div><div class="sect"><b>Account</b></div><div class="card"><div class="setting" onclick="toast(\'Personal details opened\')"><b>Personal details</b>　›</div><div class="setting" onclick="toast(\'Help center opened\')"><b>Help & support</b>　›</div></div><button class="btn full" style="background:white;color:#d85f70;box-shadow:none;border:1px solid #f1dfe3" onclick="logoutdialog()">Log out</button>'
        );
      }
      function fmt() {
        return (
          String(Math.floor(secs / 60)).padStart(2, "0") +
          ":" +
          String(secs % 60).padStart(2, "0")
        );
      }
      function render(p) {
        let f = {
          home,
          routine,
          planner,
          progress,
          profile,
          suggestions,
          focus,
        }[p];
        document.getElementById("view").innerHTML = f();
        document
          .getElementById("nav")
          .classList.toggle("hide", p === "focus" || p === "suggestions");
        document
          .getElementById("fab")
          .classList.toggle("hide", p !== "planner");
        document
          .querySelectorAll(".nav button")
          .forEach((n) =>
            n.classList.toggle(
              "active",
              n.dataset.p === p || (p === "focus" && n.dataset.p === "planner"),
            ),
          );
      }
      function go(p) {
        render(p);
      }
      function login() {
        let p = document.getElementById("pass"),
          e = document.getElementById("err"),
          b = document.getElementById("loginbtn");
        if (!p.value || p.value === "wrong") {
          p.classList.add("error");
          e.classList.remove("hide");
          return;
        }
        b.innerHTML = "◌ Signing in…";
        setTimeout(() => {
          document.getElementById("login").classList.add("hide");
          document.getElementById("view").classList.remove("hide");
          document.getElementById("nav").classList.remove("hide");
          render("home");
          toast("Welcome back, Alex!");
        }, 700);
      }
      function toast(s) {
        let t = document.getElementById("toast");
        t.textContent = s;
        t.classList.add("show");
        clearTimeout(window.tt);
        window.tt = setTimeout(() => t.classList.remove("show"), 2100);
      }
      function select(d) {
        day = d;
        render("routine");
      }
      function water(n) {
        glasses = Math.max(0, Math.min(8, glasses + n));
        render("home");
        toast("Water tracker updated 💧");
      }
      function check(i, v) {
        tasks[i][2] = v;
        render("planner");
        toast(v ? "Task complete! ✓" : "Task moved back to today");
      }
      function addTask() {
        document.getElementById("modal").innerHTML =
          '<div class="shade" onclick="if(event.target===this)close()"><div class="modal"><b>Add a task</b><p>Choose a quick task for today’s plan.</p><input id="newtask" class="input" placeholder="e.g. Review lecture notes"><div class="actions" style="margin-top:13px"><button class="secondary" onclick="close()">Cancel</button><button class="btn" style="flex:1;height:43px" onclick="save()">Add task</button></div></div></div>';
      }
      function save() {
        tasks.push([
          document.getElementById("newtask").value || "Review lecture notes",
          "Study session · 30 min",
          false,
        ]);
        close();
        render("planner");
        toast("Task added ✓");
      }
      function close() {
        document.getElementById("modal").innerHTML = "";
      }
      function setmode(n) {
        running = false;
        clearInterval(iv);
        secs = n * 60;
        let isf = document
          .getElementById("view")
          .innerHTML.includes("DEEP WORK");
        render(isf ? "focus" : "planner");
      }
      function toggle() {
        running = !running;
        clearInterval(iv);
        if (running)
          iv = setInterval(() => {
            secs = Math.max(0, secs - 1);
            let t = document.getElementById("timer");
            if (t) t.textContent = fmt();
            if (!secs) {
              clearInterval(iv);
              running = false;
              toast("Focus session complete! Take a break 🌿");
            }
          }, 1000);
      }
      function logoutdialog() {
        document.getElementById("modal").innerHTML =
          '<div class="shade"><div class="modal"><b>Log out of StudyMate?</b><p>You can come back to your study plan whenever you’re ready.</p><div class="actions"><button class="secondary" onclick="close()">Stay here</button><button class="danger" onclick="logout()">Log out</button></div></div></div>';
      }
      function logout() {
        close();
        document.getElementById("view").classList.add("hide");
        document.getElementById("nav").classList.add("hide");
        document.getElementById("login").classList.remove("hide");
        document.getElementById("pass").value = "";
        document.getElementById("loginbtn").innerHTML = "Log in　→";
        toast("You’ve been logged out");
      }
    </script>
  </body>
</html>
